<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BURUJ Dynamics</title>
<meta name="description" content="BURUJ Dynamics: engineering from the ground to the sky. Our website is launching soon.">
<meta property="og:title" content="BURUJ Dynamics">
<meta property="og:description" content="Engineering from the ground to the sky. Our website is launching soon.">
<meta property="og:url" content="https://burujdynamics.com">
<meta name="theme-color" content="#0f1830">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1830'/%3E%3Cpolygon points='32,8 37,26 56,32 37,38 32,56 27,38 8,32 27,26' fill='%23c4a26a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri&family=Hanken+Grotesk:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0f1830;
    --lapis: #1b2a55;
    --brass: #c4a26a;
    --brass-dim: #8a7350;
    --star: #eef1f8;
    --muted: #a9b2c8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: radial-gradient(ellipse at 72% 38%, var(--lapis) 0%, var(--night) 62%);
    background-color: var(--night);
    color: var(--star);
    font-family: "Hanken Grotesk", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    flex: 1;
    width: 100%;
    max-width: 1120px;
    margin: 0 auto;
    padding: clamp(2rem, 6vw, 5rem) 16px;
    display: grid;
    grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
    align-items: center;
    gap: clamp(2rem, 6vw, 6rem);
  }
  .lockup {
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
    color: var(--brass);
    font-weight: 500;
    font-size: 1.05rem;
    letter-spacing: 0.02em;
    margin: 0;
  }
  .lockup .ar {
    font-family: "Amiri", serif;
    font-size: 1.6rem;
    line-height: 1;
  }
  h1 {
    font-family: "Instrument Serif", Georgia, serif;
    font-weight: 400;
    font-size: clamp(2.6rem, 6vw, 4.6rem);
    line-height: 1.05;
    margin: 0.6em 0 0.5em;
    max-width: 14ch;
  }
  .lede {
    color: var(--muted);
    font-size: 1.125rem;
    line-height: 1.6;
    max-width: 42ch;
    margin: 0;
  }
  .contact {
    display: inline-block;
    margin-top: 1.5rem;
    color: var(--star);
    text-decoration: none;
    font-size: 1.125rem;
    border-bottom: 1px solid var(--brass);
    padding-bottom: 2px;
  }
  .contact:hover { color: var(--brass); }
  .contact:focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 4px;
    border-radius: 2px;
  }
  .sky {
    position: relative;
    margin: 0;
    aspect-ratio: 1 / 1;
    width: 100%;
  }
  .sky svg, .sky img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .sky img { object-fit: contain; }
  .sky.has-img svg { display: none; }
  .spin {
    transform-origin: 200px 200px;
    animation: turn 240s linear infinite;
  }
  @keyframes turn { to { transform: rotate(360deg); } }
  .reveal { animation: fade 1.4s ease-out both; }
  .reveal.late { animation-delay: 0.3s; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } }
  footer {
    padding: 1.5rem 16px;
    text-align: center;
    color: var(--muted);
    font-size: 0.875rem;
  }
  @media (max-width: 760px) {
    .wrap { grid-template-columns: 1fr; }
    .sky { order: -1; max-width: 300px; margin: 0 auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    .spin, .reveal { animation: none; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <section class="reveal">
      <p class="lockup"><span>BURUJ Dynamics</span><span class="ar" lang="ar">بُرُوج</span></p>
      <h1>Engineering from the ground to the sky.</h1>
      <p class="lede">Our website is being built and will launch soon. Until then, you can reach us directly.</p>
      <a class="contact" href="mailto:info@burujdynamics.com">info@burujdynamics.com</a>
    </section>

    <figure class="sky reveal late" aria-hidden="true">
      <!-- To use your 3D image: upload it next to this file and name it hero.png. It replaces the drawing automatically. -->
      <img src="hero.png" alt="" onload="this.parentNode.classList.add('has-img')" onerror="this.remove()">
      <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
        <!-- faint background stars -->
        <g fill="#eef1f8" opacity="0.45">
          <circle cx="40" cy="60" r="1"/><circle cx="360" cy="40" r="1.2"/><circle cx="380" cy="330" r="1"/>
          <circle cx="22" cy="300" r="1.1"/><circle cx="150" cy="18" r="0.9"/><circle cx="250" cy="388" r="1"/>
          <circle cx="96" cy="372" r="0.8"/><circle cx="318" cy="210" r="0.7"/>
        </g>
        <!-- outer graduated ring, like an astrolabe -->
        <circle cx="200" cy="200" r="182" fill="none" stroke="#8a7350" stroke-width="0.8"/>
        <circle cx="200" cy="200" r="172" fill="none" stroke="#c4a26a" stroke-width="6" stroke-dasharray="1.2 13.63" opacity="0.7"/>
        <circle cx="200" cy="200" r="100" fill="none" stroke="#8a7350" stroke-width="0.8"/>
        <g class="spin">
          <!-- twelve-pointed star joining the twelve buruj -->
          <polygon fill="none" stroke="#c4a26a" stroke-width="1" opacity="0.85"
            points="350,200 70.1,275 275,70.1 200,350 125,70.1 329.9,275 50,200 329.9,125 125,329.9 200,50 275,329.9 70.1,125"/>
          <g fill="#eef1f8">
            <circle cx="350" cy="200" r="3.4"/><circle cx="329.9" cy="275" r="2.4"/><circle cx="275" cy="329.9" r="3"/>
            <circle cx="200" cy="350" r="2.2"/><circle cx="125" cy="329.9" r="3.2"/><circle cx="70.1" cy="275" r="2.5"/>
            <circle cx="50" cy="200" r="3.4"/><circle cx="70.1" cy="125" r="2.3"/><circle cx="125" cy="70.1" r="3"/>
            <circle cx="200" cy="50" r="2.6"/><circle cx="275" cy="70.1" r="3.3"/><circle cx="329.9" cy="125" r="2.2"/>
          </g>
        </g>
        <!-- the ground at the centre -->
        <circle cx="200" cy="200" r="6" fill="#c4a26a"/>
      </svg>
    </figure>
  </main>
  <footer>© 2026 BURUJ Dynamics</footer>
</body>
</html>
